<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Elegir impresora · Nonno</title>
<style>
  @page { size: portrait; margin: 3mm; }
  :root { color-scheme: light; }
  html, body { background: #fff; color: #000; }
  body { font-family: "Courier New", monospace; text-align: center; margin: 0; padding: 4mm 0; }
  h1 { font-size: 22px; margin: 0 0 6px; }
  .rol { font-size: 30px; font-weight: bold; border: 3px solid #000; padding: 6px; margin: 10px 0; }
  .ayuda { font-family: system-ui, sans-serif; font-size: 16px; max-width: 520px; margin: 24px auto; }
  @media print { .ayuda { display: none; } }
</style>
</head>
<body>
  <h1>LA PIZZA DE NONNO</h1>
  <div>Prueba de impresora</div>
  <div class="rol" id="rol">IMPRESORA</div>
  <div>Si lees esto, esta ventana ya imprime aquí.</div>

  <div class="ayuda">
    <p><strong>En la ventana de imprimir, elige la impresora de <span id="rol2"></span> y pulsa Imprimir.</strong></p>
    <p>Chrome la recordará para esta ventana de Nonno. Cuando salga el papel, cierra esta ventana.</p>
  </div>

<script>
  const rol = location.hash.replace('#', '') === 'cocina' ? 'COCINA' : 'MOSTRADOR / TPV'
  document.getElementById('rol').textContent = rol
  document.getElementById('rol2').textContent = rol
  setTimeout(() => window.print(), 600)
</script>
</body>
</html>
